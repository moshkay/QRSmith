# Runtime compose file deployed to the EC2 host. The CI pipeline loads the
# "qrforge:latest" image from a tarball, then runs `docker compose up -d`.
services:
  qrforge:
    image: qrforge:latest
    container_name: qrforge
    restart: unless-stopped
    ports:
      # Public HTTP on port 80 -> app on 8080 inside the container.
      # Ensure the EC2 security group allows inbound TCP 80.
      - "80:8080"
    environment:
      PORT: "8080"
      READ_TIMEOUT: "15s"
      WRITE_TIMEOUT: "30s"
      MAX_CONTENT_BYTES: "2048"
      MAX_LOGO_BYTES: "2097152"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        # Requests (reservations) AND limits, per infra standards.
        reservations:
          cpus: "0.10"
          memory: 64M
        limits:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
