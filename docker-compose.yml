# Runtime compose file deployed to the EC2 host. The CI pipeline loads the
# "qrforge:latest" image from a tarball, then runs `docker compose up -d`.
#
# Topology: nginx (public 80/443) --> qrforge (internal :8080).
services:
  qrforge:
    image: qrforge:latest
    container_name: qrforge
    restart: unless-stopped
    # No host port: only nginx (same network) reaches it via "qrforge:8080".
    expose:
      - "8080"
    environment:
      PORT: "8080"
      READ_TIMEOUT: "15s"
      WRITE_TIMEOUT: "30s"
      MAX_CONTENT_BYTES: "2048"
      MAX_LOGO_BYTES: "2097152"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        reservations:
          cpus: "0.10"
          memory: 64M
        limits:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: qrforge_nginx
    restart: unless-stopped
    depends_on:
      qrforge:
        condition: service_healthy
    ports:
      # Ensure the EC2 security group allows inbound TCP 80 (and 443 for HTTPS).
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/qrforge.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      # Holds the HTTPS server block created by scripts/init-tls.sh. Persisted
      # across deploys and never overwritten by CI.
      - nginx_ssl:/etc/nginx/ssl-enabled
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        reservations:
          cpus: "0.05"
          memory: 16M
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Certbot runs on-demand only (via `scripts/init-tls.sh` / `renew-tls.sh`),
  # never as part of `docker compose up`, thanks to the "tools" profile.
  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

volumes:
  certbot_certs:
  certbot_webroot:
  nginx_ssl:
