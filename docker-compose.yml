# Runtime compose file deployed to the EC2 host. The CI pipeline loads the
# "qrforge:latest" image from a tarball, then runs `docker compose up -d`.
#
# Topology: host nginx (public 80/443, terminates TLS) --> qrforge (127.0.0.1:8090).
# The app container binds to localhost ONLY, so it is never reachable from the
# public internet directly -- all traffic must go through the host reverse proxy.
services:
  qrforge:
    image: qrforge:latest
    container_name: qrforge
    restart: unless-stopped
    # Bind to loopback only. The host nginx proxies qr.moshcore.com.ng here.
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      PORT: "8080"
      READ_TIMEOUT: "15s"
      WRITE_TIMEOUT: "30s"
      MAX_CONTENT_BYTES: "2048"
      MAX_LOGO_BYTES: "2097152"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        reservations:
          cpus: "0.10"
          memory: 64M
        limits:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
