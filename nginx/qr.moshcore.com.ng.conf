# Host nginx vhost for QRForge (domain: qr.moshcore.com.ng).
#
# This runs on your existing HOST nginx (the one already serving your other
# app on ports 80/443) -- NOT inside a container. It proxies the domain to the
# QRForge app container, which listens on 127.0.0.1:8090 (see docker-compose.yml).
#
# Install on the server:
#   sudo cp qr.moshcore.com.ng.conf /etc/nginx/conf.d/qr.moshcore.com.ng.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain TLS with the host certbot (nginx plugin) -- it rewrites this file
# to add the 443 server block and an HTTP->HTTPS redirect automatically:
#   sudo certbot --nginx -d qr.moshcore.com.ng
#
# (On Debian/Ubuntu you may prefer sites-available + a symlink into
#  sites-enabled instead of conf.d -- use whatever your other site uses.)

upstream qrforge_backend {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name qr.moshcore.com.ng;

    # Allow room for base64 logo uploads (app caps decoded logos at ~2 MiB).
    client_max_body_size 8m;

    # Gzip text-like responses (JSON API + SVG QR codes).
    gzip on;
    gzip_types application/json image/svg+xml text/css application/javascript text/plain;
    gzip_min_length 512;

    location / {
        proxy_pass http://qrforge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
