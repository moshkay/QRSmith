# Nginx reverse proxy for QRForge.
# Mounted into the nginx container at /etc/nginx/conf.d/default.conf.
#
# By default this serves plain HTTP on port 80 and proxies to the qrforge
# container. To enable HTTPS, obtain a certificate (see README) and uncomment
# the HTTPS server block plus the redirect line marked below.

upstream qrforge_backend {
    server qrforge:8080;
    keepalive 16;
}

# Allow room for base64 logo uploads (app caps decoded logos at ~2 MiB).
client_max_body_size 8m;

# Gzip text-like responses (JSON API + SVG QR codes).
gzip on;
gzip_types application/json image/svg+xml text/css application/javascript text/plain;
gzip_min_length 512;

server {
    listen 80;
    listen [::]:80;
    server_name _;  # replace with your domain, e.g. qr.example.com

    # Let's Encrypt HTTP-01 challenge (served from the certbot webroot volume).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- After you have a certificate, uncomment to force HTTPS ---
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    location / {
        proxy_pass http://qrforge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

