# Nginx reverse proxy for QRForge (domain: qr.moshcore.com.ng).
# Mounted into the nginx container at /etc/nginx/conf.d/default.conf.
#
# This file always serves HTTP on port 80 (so nginx starts even before a
# certificate exists) and exposes the ACME challenge path. HTTPS is added by
# `scripts/init-tls.sh`, which drops a 443 server block into the
# /etc/nginx/ssl-enabled volume that the `include` at the bottom loads. That
# volume is NOT shipped by CI, so deploys never clobber your TLS setup.

upstream qrforge_backend {
    server qrforge:8080;
    keepalive 16;
}

# Allow room for base64 logo uploads (app caps decoded logos at ~2 MiB).
client_max_body_size 8m;

# Gzip text-like responses (JSON API + SVG QR codes).
gzip on;
gzip_types application/json image/svg+xml text/css application/javascript text/plain;
gzip_min_length 512;

server {
    listen 80;
    listen [::]:80;
    server_name qr.moshcore.com.ng;

    # Let's Encrypt HTTP-01 challenge (served from the certbot webroot volume).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://qrforge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# HTTPS server block(s) are generated by scripts/init-tls.sh into this volume.
# A wildcard include that matches no files is fine (nginx starts on HTTP only).
include /etc/nginx/ssl-enabled/*.conf;
